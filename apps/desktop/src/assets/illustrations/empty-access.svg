<svg width="320" height="320" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Glow Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFDBCF" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#FAF2EE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FAF2EE" stop-opacity="0"/>
    </radialGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#C85A30"/>
      <stop offset="100%" stop-color="#983912"/>
    </linearGradient>

    <!-- Badge Header Gradient -->
    <linearGradient id="badgeHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#486B52"/>
      <stop offset="100%" stop-color="#35533F"/>
    </linearGradient>

    <!-- Key Gradient -->
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB59C"/>
      <stop offset="100%" stop-color="#B85028"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#433027" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E1B19" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Circle -->
  <circle cx="160" cy="160" r="140" fill="url(#bgGlow)"/>

  <!-- Background Decorative Pill / Slider -->
  <g filter="url(#softShadow)">
    <rect x="52" y="78" width="88" height="36" rx="18" fill="#FFFFFF"/>
    <circle cx="70" cy="96" r="12" fill="#C2E9CA"/>
    <path d="M66 96L69 99L75 93" stroke="#2C4E37" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="90" y="93" width="36" height="6" rx="3" fill="#E8E1DD"/>
  </g>

  <!-- Floating Digital ID Credential Card (Back-Left) -->
  <g filter="url(#cardShadow)" transform="rotate(-7 115 170)">
    <rect x="65" y="115" width="105" height="135" rx="14" fill="#FFFFFF" stroke="#E8E1DD" stroke-width="1.5"/>
    <!-- Card Header Strip -->
    <path d="M65 129C65 121.268 71.268 115 79 115H156C163.732 115 170 121.268 170 129V142H65V129Z" fill="url(#badgeHeaderGrad)"/>
    <circle cx="82" cy="128.5" r="4" fill="#C2E9CA"/>
    <!-- Avatar Circle Placeholder -->
    <circle cx="117.5" cy="172" r="18" fill="#FAF2EE" stroke="#E8E1DD" stroke-width="1.5"/>
    <circle cx="117.5" cy="167" r="7" fill="#8A726A"/>
    <path d="M104 186C104 179.373 109.373 177 117.5 177C125.627 177 131 179.373 131 186" fill="#8A726A"/>
    <!-- Text Lines Placeholder -->
    <rect x="85" y="202" width="65" height="5" rx="2.5" fill="#57423B"/>
    <rect x="95" y="213" width="45" height="4" rx="2" fill="#E8E1DD"/>
    <rect x="90" y="223" width="55" height="4" rx="2" fill="#FAF2EE"/>
  </g>

  <!-- Central Shield of Governance & Role Authority -->
  <g filter="url(#cardShadow)">
    <path d="M185 82C185 82 225 80 248 95C248 152 228 198 185 224C142 198 122 152 122 95C145 80 185 82 185 82Z"
          fill="url(#shieldGrad)"
          stroke="#FFFFFF"
          stroke-width="3"/>

    <!-- Inner Shield Accent Line -->
    <path d="M185 92C185 92 218 90 236 103C236 149 220 186 185 208C150 186 134 149 134 103C152 90 185 92 185 92Z"
          stroke="#FFB59C"
          stroke-width="1.5"
          stroke-dasharray="3 3"
          fill="none"
          opacity="0.7"/>

    <!-- Keyhole / Padlock Motif on Shield -->
    <circle cx="185" cy="142" r="14" fill="#FFFFFF"/>
    <path d="M178 142C178 138.134 181.134 135 185 135C188.866 135 192 138.134 192 142V148H178V142Z" fill="none" stroke="#983912" stroke-width="2.5"/>
    <circle cx="185" cy="154" r="4" fill="#983912"/>
    <path d="M183.5 156L182 166H188L186.5 156" fill="#983912"/>
  </g>

  <!-- Digital Key Pass (Right-Floating) -->
  <g filter="url(#cardShadow)" transform="rotate(18 238 200)">
    <circle cx="230" cy="180" r="16" fill="url(#keyGrad)" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="230" cy="180" r="7" fill="#FAF2EE"/>
    <rect x="238" y="176" width="34" height="8" rx="3" fill="url(#keyGrad)" stroke="#FFFFFF" stroke-width="1.5"/>
    <rect x="260" y="184" width="4" height="6" rx="1.5" fill="#B85028"/>
    <rect x="266" y="184" width="4" height="8" rx="1.5" fill="#B85028"/>
  </g>

  <!-- Sparkles & Ambient Accents -->
  <!-- Top Right Sparkle -->
  <path d="M255 60L257.5 67.5L265 70L257.5 72.5L255 80L252.5 72.5L245 70L252.5 67.5L255 60Z" fill="#B85028"/>
  <!-- Left Green Sparkle -->
  <path d="M60 175L61.5 180.5L67 182L61.5 183.5L60 189L58.5 183.5L53 182L58.5 180.5L60 175Z" fill="#486B52"/>
  <!-- Bottom Soft Dots -->
  <circle cx="130" cy="256" r="3.5" fill="#FFB59C"/>
  <circle cx="215" cy="245" r="4.5" fill="#C2E9CA"/>
  <circle cx="245" cy="120" r="3" fill="#E8E1DD"/>
</svg>

