<svg width="480" height="340" viewBox="0 0 480 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="errorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFDBCF" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FAF2EE" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FAF2EE" stop-opacity="0"/>
    </radialGradient>

    <!-- Terracotta / Crimson Gradient for Error Elements -->
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9532F"/>
      <stop offset="70%" stop-color="#B85028"/>
      <stop offset="100%" stop-color="#8C2C08"/>
    </linearGradient>

    <!-- Warm Charcoal Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2420"/>
      <stop offset="100%" stop-color="#1A1513"/>
    </linearGradient>

    <!-- Amber Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Sage Repair Gradient -->
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B8767"/>
      <stop offset="100%" stop-color="#3D5F47"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="errorDropShadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#433027" flood-opacity="0.14"/>
    </filter>
    <filter id="floatingCardShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E1B19" flood-opacity="0.09"/>
    </filter>
    <filter id="sparkGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#F59E0B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 1. Ambient Backdrop Glow -->
  <circle cx="240" cy="170" r="160" fill="url(#errorGlow)"/>

  <!-- 2. Technical Circuit Glitch Lines in Background -->
  <g stroke="#E8E1DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <!-- Left Circuit Stem -->
    <path d="M60 170H110L135 140H170"/>
    <circle cx="60" cy="170" r="3" fill="#B85028"/>
    <circle cx="170" cy="140" r="3" fill="#E2845E"/>

    <!-- Right Circuit Stem -->
    <path d="M310 130H345L370 160H420"/>
    <circle cx="310" cy="130" r="3" fill="#486B52"/>
    <circle cx="420" cy="160" r="3" fill="#B85028"/>

    <!-- Bottom Ground Ticks -->
    <line x1="100" y1="280" x2="380" y2="280" stroke-dasharray="4 4"/>
  </g>

  <!-- 3. Main Central App Window / Workstation Screen -->
  <g filter="url(#errorDropShadow)">
    <!-- Monitor Bezel Outer Frame -->
    <rect x="110" y="55" width="260" height="175" rx="16" fill="#FFFFFF" stroke="#E8E1DD" stroke-width="2"/>
    <!-- Window Title Bar -->
    <path d="M110 71C110 62.163 117.163 55 126 55H354C362.837 55 370 62.163 370 71V82H110V71Z" fill="#FAF2EE"/>
    <line x1="110" y1="82" x2="370" y2="82" stroke="#E8E1DD" stroke-width="1.2"/>
    <!-- Window Control Dots -->
    <circle cx="128" cy="68.5" r="4.5" fill="#B85028"/>
    <circle cx="142" cy="68.5" r="4.5" fill="#F59E0B"/>
    <circle cx="156" cy="68.5" r="4.5" fill="#486B52"/>
    <!-- App Window Title -->
    <rect x="200" y="66" width="80" height="5" rx="2.5" fill="#8A726A" opacity="0.6"/>

    <!-- Inner Screen Area (Warm Deep Charcoal Display) -->
    <rect x="120" y="90" width="240" height="130" rx="8" fill="url(#screenGrad)"/>

    <!-- Screen Scanlines / Subtle Digital Grid -->
    <g opacity="0.12" stroke="#FAF2EE" stroke-width="1">
      <line x1="120" y1="115" x2="360" y2="115"/>
      <line x1="120" y1="140" x2="360" y2="140"/>
      <line x1="120" y1="165" x2="360" y2="165"/>
      <line x1="120" y1="190" x2="360" y2="190"/>
    </g>

    <!-- Glitch / Disconnected Signal Waveform inside display -->
    <path d="M135 155H170L180 135L195 175L210 145L225 155H240" fill="none" stroke="#E2845E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <path d="M245 155H260L270 140L285 168L295 155H345" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

    <!-- Center Alert Warning Shield on Screen -->
    <g transform="translate(216, 110)">
      <!-- Shield Base -->
      <path d="M24 0C24 0 38 -2 46 6C46 26 38 42 24 50C10 42 2 26 2 6C10 -2 24 0 24 0Z" fill="url(#alertGrad)" stroke="#FAF2EE" stroke-width="2"/>
      <!-- Exclamation Mark Inside Shield -->
      <line x1="24" y1="14" x2="24" y2="28" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <circle cx="24" cy="36" r="2" fill="#FFFFFF"/>
    </g>

    <!-- Monospace Error Status Banner inside display -->
    <rect x="145" y="180" width="190" height="20" rx="5" fill="#3D2B24" stroke="#B85028" stroke-width="1"/>
    <circle cx="160" cy="190" r="3" fill="#E2845E"/>
    <text x="175" y="194" font-family="ui-monospace, monospace" font-size="9" font-weight="bold" fill="#FFDBCF" letter-spacing="0.5">UNEXPECTED_EXCEPTION</text>
  </g>

  <!-- Monitor Stand & Base -->
  <g>
    <!-- Stand Neck -->
    <polygon points="228,230 252,230 256,265 224,265" fill="#E8E1DD" stroke="#D3C7C0" stroke-width="1.5"/>
    <!-- Base Plate -->
    <ellipse cx="240" cy="265" rx="45" ry="8" fill="#FAF2EE" stroke="#E8E1DD" stroke-width="2"/>
    <ellipse cx="240" cy="264" rx="32" ry="4" fill="#E8E1DD"/>
  </g>

  <!-- 4. Disconnected Cable & Friendly Spark Plug (Left Foreground) -->
  <g filter="url(#floatingCardShadow)" transform="translate(65, 185)">
    <!-- Cable Wire Loop -->
    <path d="M-5 45C15 45 20 20 40 20H60" fill="none" stroke="#57423B" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Plug Body -->
    <rect x="60" y="11" width="26" height="18" rx="4" fill="#B85028" stroke="#8C2C08" stroke-width="1.2"/>
    <rect x="56" y="14" width="4" height="12" rx="1.5" fill="#57423B"/>
    <!-- Plug Metal Pins -->
    <rect x="86" y="13" width="8" height="4" rx="1" fill="#E8E1DD"/>
    <rect x="86" y="23" width="8" height="4" rx="1" fill="#E8E1DD"/>

    <!-- Friendly Electric Spark Gap -->
    <g filter="url(#sparkGlow)" transform="translate(98, 12)">
      <polygon points="5,-4 7,4 12,5 7,8 6,15 2,9 -3,10 1,5 -1,-2" fill="url(#sparkGrad)"/>
    </g>

    <!-- Socket Node Card -->
    <rect x="110" y="5" width="28" height="30" rx="6" fill="#FFFFFF" stroke="#E8E1DD" stroke-width="1.5"/>
    <circle cx="124" cy="15" r="2.5" fill="#57423B"/>
    <circle cx="124" cy="25" r="2.5" fill="#57423B"/>
  </g>

  <!-- 5. Repair Wrench & Diagnostic Tooling (Right Foreground) -->
  <g filter="url(#floatingCardShadow)" transform="rotate(-18 360 215)">
    <!-- Wrench Tool Handle -->
    <rect x="340" y="190" width="16" height="60" rx="8" fill="url(#sageGrad)" stroke="#2C4E37" stroke-width="1.5"/>
    <circle cx="348" cy="238" r="4" fill="#FFFFFF"/>
    <!-- Wrench Open Head -->
    <path d="M338 195C335 190 334 182 338 175C343 168 353 168 358 175C362 182 361 190 358 195H338Z" fill="#82A78C" stroke="#2C4E37" stroke-width="1.5"/>
    <!-- Head Cutout -->
    <polygon points="344,170 352,170 350,182 346,182" fill="#FAF2EE"/>
  </g>

  <!-- Floating Diagnostic Code Card (Top-Right) -->
  <g filter="url(#floatingCardShadow)" transform="rotate(6 375 95)">
    <rect x="340" y="70" width="85" height="48" rx="10" fill="#FFFFFF" stroke="#E8E1DD" stroke-width="1.5"/>
    <circle cx="355" cy="84" r="5" fill="#FAF2EE" stroke="#B85028" stroke-width="1.5"/>
    <path d="M353 84L355 86L358 82" stroke="#B85028" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="366" y="81" width="45" height="5" rx="2.5" fill="#1E1B19"/>
    <rect x="350" y="96" width="60" height="4" rx="2" fill="#E8E1DD"/>
    <rect x="350" y="104" width="40" height="4" rx="2" fill="#FAF2EE"/>
  </g>

  <!-- 6. Floating Sparks & Decorative Accents -->
  <!-- Amber Spark Top-Left -->
  <g fill="url(#sparkGrad)" transform="translate(85, 95)">
    <path d="M7 0L8.6 4.9L14 7L8.6 9.1L7 14L5.4 9.1L0 7L5.4 4.9Z"/>
  </g>
  <!-- Terracotta Spark Center-Top -->
  <g fill="#B85028" transform="translate(250, 30)">
    <path d="M6 0L7.4 4.2L12 6L7.4 7.8L6 12L4.6 7.8L0 6L4.6 4.2Z"/>
  </g>
  <!-- Sage Spark Right -->
  <g fill="#486B52" transform="translate(430, 205)">
    <path d="M6 0L7.4 4.2L12 6L7.4 7.8L6 12L4.6 7.8L0 6L4.6 4.2Z"/>
  </g>

  <!-- Code Glitch Symbols "{ }" -->
  <text x="100" y="130" font-family="ui-monospace, monospace" font-size="16" font-weight="bold" fill="#B85028" opacity="0.4">{</text>
  <text x="380" y="160" font-family="ui-monospace, monospace" font-size="16" font-weight="bold" fill="#B85028" opacity="0.4">}</text>

  <circle cx="175" cy="45" r="3" fill="#E2845E" opacity="0.5"/>
  <circle cx="320" cy="40" r="2.5" fill="#486B52" opacity="0.5"/>
  <circle cx="295" cy="275" r="3.5" fill="#B85028" opacity="0.4"/>
</svg>

