<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <!-- Background glow -->
    <radialGradient id="att-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFDBCF" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#FAF2EE" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FAF2EE" stop-opacity="0"/>
    </radialGradient>

    <!-- Card gradient -->
    <linearGradient id="att-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FBF8F6"/>
    </linearGradient>

    <!-- Terracotta gradient -->
    <linearGradient id="att-terra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B85028"/>
      <stop offset="100%" stop-color="#983912"/>
    </linearGradient>

    <!-- Sage gradient -->
    <linearGradient id="att-sage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#486B52"/>
      <stop offset="100%" stop-color="#2C4E37"/>
    </linearGradient>

    <!-- Warm Amber gradient -->
    <linearGradient id="att-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2845E"/>
      <stop offset="100%" stop-color="#B85028"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="att-shadow-main" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#57423B" flood-opacity="0.12"/>
    </filter>
    <filter id="att-shadow-sub" x="-15%" y="-15%" width="135%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#57423B" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <ellipse cx="160" cy="120" rx="130" ry="90" fill="url(#att-glow)"/>

  <!-- Subtle background base ring -->
  <ellipse cx="160" cy="195" rx="110" ry="16" fill="#57423B" fill-opacity="0.04"/>

  <!-- Back Layer: Calendar Schedule Sheet -->
  <g transform="rotate(-6 130 115)" filter="url(#att-shadow-sub)">
    <rect x="75" y="45" width="130" height="130" rx="14" fill="#FFFFFF" stroke="#E8E1DD" stroke-width="1.5"/>
    <!-- Top accent bar -->
    <path d="M75 59C75 51.268 81.268 45 89 45H196C203.732 45 210 51.268 210 59V66H75V59Z" fill="#FAF2EE"/>
    <circle cx="95" cy="55.5" r="3" fill="#B85028" fill-opacity="0.6"/>
    <circle cx="106" cy="55.5" r="3" fill="#486B52" fill-opacity="0.6"/>
    <circle cx="117" cy="55.5" r="3" fill="#8A726A" fill-opacity="0.4"/>

    <!-- Calendar Grid Rows -->
    <rect x="90" y="80" width="20" height="16" rx="4" fill="#FAF2EE"/>
    <rect x="116" y="80" width="20" height="16" rx="4" fill="#FAF2EE"/>
    <rect x="142" y="80" width="20" height="16" rx="4" fill="#C2E9CA" fill-opacity="0.5"/>
    <rect x="168" y="80" width="20" height="16" rx="4" fill="#FAF2EE"/>

    <rect x="90" y="103" width="20" height="16" rx="4" fill="#C2E9CA" fill-opacity="0.5"/>
    <rect x="116" y="103" width="20" height="16" rx="4" fill="#FAF2EE"/>
    <rect x="142" y="103" width="20" height="16" rx="4" fill="#FAF2EE"/>
    <rect x="168" y="103" width="20" height="16" rx="4" fill="#FFDBCF" fill-opacity="0.6"/>

    <rect x="90" y="126" width="20" height="16" rx="4" fill="#FAF2EE"/>
    <rect x="116" y="126" width="20" height="16" rx="4" fill="#FAF2EE"/>
    <rect x="142" y="126" width="20" height="16" rx="4" fill="#FAF2EE"/>
    <rect x="168" y="126" width="20" height="16" rx="4" fill="#FAF2EE"/>
  </g>

  <!-- Front Layer: Main Attendance Check-In Card -->
  <g transform="translate(115, 60)" filter="url(#att-shadow-main)">
    <rect x="0" y="0" width="135" height="135" rx="16" fill="url(#att-card-bg)" stroke="#E8E1DD" stroke-width="1.5"/>

    <!-- Top Card Header Banner -->
    <path d="M0 16C0 7.16344 7.16344 0 16 0H119C127.837 0 135 7.16344 135 16V34H0V16Z" fill="url(#att-terra)"/>
    <rect x="14" y="14" width="45" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.9"/>
    <rect x="105" y="13" width="16" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.25"/>

    <!-- Attendee Presence Badge -->
    <g transform="translate(14, 46)">
      <!-- Avatar circle -->
      <circle cx="16" cy="16" r="16" fill="#FAF2EE" stroke="#E8E1DD" stroke-width="1"/>
      <circle cx="16" cy="12" r="6" fill="#8A726A" fill-opacity="0.5"/>
      <path d="M7 26C7 21.5 11 19 16 19C21 19 25 21.5 25 26" stroke="#8A726A" stroke-width="2" stroke-linecap="round"/>

      <!-- Name lines -->
      <rect x="40" y="7" width="55" height="7" rx="3.5" fill="#1E1B19" fill-opacity="0.8"/>
      <rect x="40" y="18" width="38" height="5" rx="2.5" fill="#8A726A" fill-opacity="0.5"/>
    </g>

    <!-- Session verification stamp / status pill -->
    <g transform="translate(14, 88)">
      <rect x="0" y="0" width="107" height="32" rx="8" fill="#F4ECE9" stroke="#E8E1DD" stroke-width="1"/>

      <!-- Checkmark badge -->
      <circle cx="16" cy="16" r="10" fill="url(#att-sage)"/>
      <path d="M12 16L15 19L20 13" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="32" y="10" width="46" height="5" rx="2.5" fill="#1E1B19" fill-opacity="0.7"/>
      <rect x="32" y="18" width="30" height="4" rx="2" fill="#486B52" fill-opacity="0.8"/>
    </g>
  </g>

  <!-- Floating Presence Counter Pill -->
  <g transform="translate(60, 145)" filter="url(#att-shadow-sub)">
    <rect x="0" y="0" width="80" height="34" rx="17" fill="#FFFFFF" stroke="#E8E1DD" stroke-width="1.5"/>
    <circle cx="17" cy="17" r="7" fill="#486B52" fill-opacity="0.2"/>
    <circle cx="17" cy="17" r="4" fill="#486B52"/>
    <rect x="30" y="11" width="36" height="5" rx="2.5" fill="#1E1B19" fill-opacity="0.8"/>
    <rect x="30" y="19" width="24" height="4" rx="2" fill="#8A726A" fill-opacity="0.5"/>
  </g>

  <!-- Decorative secular accents -->
  <!-- Checkmark circle top-right -->
  <g transform="translate(235, 45)" filter="url(#att-shadow-sub)">
    <circle cx="14" cy="14" r="14" fill="url(#att-sage)"/>
    <path d="M9 14L12.5 17.5L19 10.5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sparkle geometric stars -->
  <g transform="translate(70, 35)">
    <path d="M0 6C3 6 6 3 6 0C6 3 9 6 12 6C9 6 6 9 6 12C6 9 3 6 0 6Z" fill="#B85028" fill-opacity="0.4"/>
  </g>
  <g transform="translate(255, 175)">
    <path d="M0 5C2.5 5 5 2.5 5 0C5 2.5 7.5 5 10 5C7.5 5 5 7.5 5 10C5 7.5 2.5 5 0 5Z" fill="#E2845E" fill-opacity="0.5"/>
  </g>
  <circle cx="75" cy="115" r="2.5" fill="#486B52" fill-opacity="0.3"/>
  <circle cx="245" cy="140" r="3" fill="#B85028" fill-opacity="0.3"/>
</svg>

