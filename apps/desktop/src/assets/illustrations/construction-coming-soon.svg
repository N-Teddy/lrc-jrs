<svg width="480" height="340" viewBox="0 0 480 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="constructGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFDBCF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FAF2EE" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FAF2EE" stop-opacity="0"/>
    </radialGradient>

    <!-- Terracotta Gradients -->
    <linearGradient id="craneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2845E"/>
      <stop offset="60%" stop-color="#B85028"/>
      <stop offset="100%" stop-color="#8C2C08"/>
    </linearGradient>

    <linearGradient id="helmetGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FF9364"/>
      <stop offset="100%" stop-color="#B85028"/>
    </linearGradient>

    <linearGradient id="blueprintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D5A45"/>
      <stop offset="100%" stop-color="#233B2B"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="constructDropShadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#433027" flood-opacity="0.12"/>
    </filter>
    <filter id="softCardShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E1B19" flood-opacity="0.08"/>
    </filter>
    <filter id="craneGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#B85028" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 1. Ambient Backdrop Glow -->
  <circle cx="240" cy="170" r="160" fill="url(#constructGlow)"/>

  <!-- 2. Technical Blueprint Base Grid Lines & Floor Platform -->
  <g stroke="#E8E1DD" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.8">
    <line x1="40" y1="270" x2="440" y2="270"/>
    <line x1="80" y1="290" x2="400" y2="290"/>
    <line x1="120" y1="250" x2="120" y2="290"/>
    <line x1="240" y1="240" x2="240" y2="290"/>
    <line x1="360" y1="250" x2="360" y2="290"/>
  </g>

  <!-- Technical Tick Marks -->
  <path d="M110 270H130 M230 270H250 M350 270H370" stroke="#B85028" stroke-width="2" stroke-linecap="round"/>
  <circle cx="120" cy="270" r="3" fill="#B85028"/>
  <circle cx="240" cy="270" r="3" fill="#B85028"/>
  <circle cx="360" cy="270" r="3" fill="#B85028"/>

  <!-- 3. Left Blueprint Roll & Architectural Drafting Tablet -->
  <g filter="url(#softCardShadow)" transform="rotate(-5 105 230)">
    <!-- Architectural Blueprint Document -->
    <rect x="55" y="180" width="105" height="75" rx="8" fill="url(#blueprintGrad)" stroke="#6B8F74" stroke-width="1.5"/>
    <!-- Blueprint Internal Technical Grid -->
    <path d="M65 200H150 M65 220H150 M65 240H150" stroke="#7EAB89" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
    <path d="M85 190V245 M115 190V245 M135 190V245" stroke="#7EAB89" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
    <!-- Blueprint Vector Plan Graphic -->
    <rect x="75" y="205" width="28" height="25" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="89" y1="205" x2="89" y2="230" stroke="#FFFFFF" stroke-width="1.2"/>
    <line x1="75" y1="217" x2="103" y2="217" stroke="#FFFFFF" stroke-width="1.2"/>
    <circle cx="128" cy="218" r="10" fill="#486B52" stroke="#FFFFFF" stroke-width="1.2"/>
    <path d="M128 212V218H134" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Drafting Triangle Scale Ruler across blueprint -->
  <g filter="url(#softCardShadow)" transform="rotate(22 145 220)">
    <polygon points="120,185 165,255 85,255" fill="#FAF2EE" stroke="#B85028" stroke-width="1.5"/>
    <polygon points="122,205 145,245 102,245" fill="#FAF2EE" stroke="#E8E1DD" stroke-width="1.2"/>
    <line x1="88" y1="250" x2="94" y2="250" stroke="#B85028" stroke-width="1.5"/>
    <line x1="98" y1="250" x2="104" y2="250" stroke="#B85028" stroke-width="1.5"/>
    <line x1="108" y1="250" x2="114" y2="250" stroke="#B85028" stroke-width="1.5"/>
    <line x1="118" y1="250" x2="124" y2="250" stroke="#B85028" stroke-width="1.5"/>
    <line x1="128" y1="250" x2="134" y2="250" stroke="#B85028" stroke-width="1.5"/>
    <line x1="138" y1="250" x2="144" y2="250" stroke="#B85028" stroke-width="1.5"/>
  </g>

  <!-- 4. Central Scaffolding & Geometric Structural Tower -->
  <g stroke="#B85028" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical Framework Stems -->
    <line x1="200" y1="120" x2="200" y2="270"/>
    <line x1="280" y1="120" x2="280" y2="270"/>
    <!-- Horizontal Crossbeams -->
    <line x1="195" y1="140" x2="285" y2="140"/>
    <line x1="195" y1="190" x2="285" y2="190"/>
    <line x1="195" y1="240" x2="285" y2="240"/>
    <!-- Diagonal Bracing Ties -->
    <line x1="200" y1="140" x2="280" y2="190" stroke-width="1.8" stroke="#E2845E"/>
    <line x1="280" y1="140" x2="200" y2="190" stroke-width="1.8" stroke="#E2845E"/>
    <line x1="200" y1="190" x2="280" y2="240" stroke-width="1.8" stroke="#E2845E"/>
    <line x1="280" y1="190" x2="200" y2="240" stroke-width="1.8" stroke="#E2845E"/>
    <!-- Platform Planks -->
    <rect x="190" y="136" width="100" height="7" rx="3.5" fill="#57423B" stroke="none"/>
    <rect x="190" y="186" width="100" height="7" rx="3.5" fill="#57423B" stroke="none"/>
  </g>

  <!-- Structural Nodes / Rivets -->
  <circle cx="200" cy="140" r="4.5" fill="#FFFFFF" stroke="#B85028" stroke-width="2"/>
  <circle cx="280" cy="140" r="4.5" fill="#FFFFFF" stroke="#B85028" stroke-width="2"/>
  <circle cx="200" cy="190" r="4.5" fill="#FFFFFF" stroke="#B85028" stroke-width="2"/>
  <circle cx="280" cy="190" r="4.5" fill="#FFFFFF" stroke="#B85028" stroke-width="2"/>
  <circle cx="200" cy="240" r="4.5" fill="#FFFFFF" stroke="#B85028" stroke-width="2"/>
  <circle cx="280" cy="240" r="4.5" fill="#FFFFFF" stroke="#B85028" stroke-width="2"/>

  <!-- 5. Sleek Overhead Construction Crane Arm (Top-Right) -->
  <g filter="url(#craneGlow)">
    <!-- Main Tower Mast Peak -->
    <polygon points="340,35 348,35 352,190 336,190" fill="url(#craneGrad)"/>
    <!-- Lattice truss cuts in mast -->
    <line x1="338" y1="65" x2="350" y2="85" stroke="#FAF2EE" stroke-width="1.5"/>
    <line x1="350" y1="65" x2="338" y2="85" stroke="#FAF2EE" stroke-width="1.5"/>
    <line x1="338" y1="105" x2="350" y2="125" stroke="#FAF2EE" stroke-width="1.5"/>
    <line x1="350" y1="105" x2="338" y2="125" stroke="#FAF2EE" stroke-width="1.5"/>
    <line x1="338" y1="145" x2="350" y2="165" stroke="#FAF2EE" stroke-width="1.5"/>
    <line x1="350" y1="145" x2="338" y2="165" stroke="#FAF2EE" stroke-width="1.5"/>

    <!-- Horizontal Jib Boom Arm extending left -->
    <polygon points="175,50 375,50 365,60 185,60" fill="url(#craneGrad)"/>
    <!-- Top Apex Pendant Tower & Tension Cables -->
    <polygon points="340,15 348,15 352,50 336,50" fill="#8C2C08"/>
    <line x1="344" y1="15" x2="200" y2="50" stroke="#B85028" stroke-width="1.8"/>
    <line x1="344" y1="15" x2="260" y2="50" stroke="#B85028" stroke-width="1.8"/>
    <line x1="344" y1="15" x2="370" y2="50" stroke="#B85028" stroke-width="1.8"/>

    <!-- Counterweight Box on Right Tail -->
    <rect x="360" y="44" width="28" height="20" rx="3" fill="#57423B" stroke="#1E1B19" stroke-width="1.5"/>
    <line x1="368" y1="48" x2="368" y2="60" stroke="#8A726A" stroke-width="1.5"/>
    <line x1="374" y1="48" x2="374" y2="60" stroke="#8A726A" stroke-width="1.5"/>
    <line x1="380" y1="48" x2="380" y2="60" stroke="#8A726A" stroke-width="1.5"/>

    <!-- Trolley Car on Jib -->
    <rect x="230" y="56" width="22" height="10" rx="2" fill="#1E1B19"/>
    <circle cx="235" cy="56" r="3" fill="#B85028"/>
    <circle cx="247" cy="56" r="3" fill="#B85028"/>

    <!-- Steel Hoist Cables Hanging Down -->
    <line x1="237" y1="66" x2="237" y2="95" stroke="#57423B" stroke-width="1.8" stroke-dasharray="3 2"/>
    <line x1="245" y1="66" x2="245" y2="95" stroke="#57423B" stroke-width="1.8" stroke-dasharray="3 2"/>

    <!-- Heavy-Duty Pulley Block & Swivel Crane Hook -->
    <rect x="233" y="95" width="16" height="12" rx="3" fill="#B85028"/>
    <circle cx="241" cy="101" r="3.5" fill="#FAF2EE"/>
    <!-- Crane Hook -->
    <path d="M241 107V114C241 117 237 121 233 121C229 121 227 118 227 115" stroke="#57423B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="233" cy="120" r="1.5" fill="#B85028"/>
  </g>

  <!-- 6. Hoisted Floating Dashboard Analytics Block (Being lowered onto scaffolding) -->
  <g filter="url(#constructDropShadow)" transform="translate(195, 115)">
    <!-- Container Card -->
    <rect x="0" y="0" width="90" height="58" rx="10" fill="#FFFFFF" stroke="#E8E1DD" stroke-width="1.5"/>
    <!-- Top Mini Card Header with Status Dot -->
    <rect x="0" y="0" width="90" height="16" rx="9" fill="#FAF2EE"/>
    <circle cx="12" cy="8" r="3" fill="#486B52"/>
    <rect x="20" y="6" width="35" height="4" rx="2" fill="#B85028"/>
    <circle cx="78" cy="8" r="3" fill="#E2845E"/>

    <!-- Dynamic Mini Chart Sparkline -->
    <path d="M10 40L28 32L45 37L65 24L80 28" fill="none" stroke="#486B52" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="65" cy="24" r="3" fill="#486B52"/>
    <!-- Mini Metric Progress Bar -->
    <rect x="10" y="47" width="70" height="4" rx="2" fill="#FAF2EE"/>
    <rect x="10" y="47" width="48" height="4" rx="2" fill="url(#craneGrad)"/>

    <!-- Rigging Straps connecting to hook -->
    <line x1="12" y1="0" x2="40" y2="-8" stroke="#B85028" stroke-width="1.5" stroke-dasharray="2 1"/>
    <line x1="78" y1="0" x2="42" y2="-8" stroke="#B85028" stroke-width="1.5" stroke-dasharray="2 1"/>
  </g>

  <!-- 7. Right Side Floating Metric Card (78% Complete Indicator) -->
  <g filter="url(#softCardShadow)" transform="rotate(4 360 170)">
    <rect x="315" y="145" width="105" height="60" rx="12" fill="#FFFFFF" stroke="#E8E1DD" stroke-width="1.5"/>
    <circle cx="342" cy="175" r="16" fill="#FAF2EE" stroke="#C2E9CA" stroke-width="3"/>
    <path d="M342 159A16 16 0 1 1 328 183" fill="none" stroke="#486B52" stroke-width="3.5" stroke-linecap="round"/>
    <text x="342" y="179" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#2C4E37">78%</text>

    <!-- Text Placeholders -->
    <rect x="366" y="162" width="42" height="6" rx="3" fill="#1E1B19"/>
    <rect x="366" y="173" width="30" height="4.5" rx="2.2" fill="#8A726A"/>
    <rect x="366" y="183" width="38" height="4.5" rx="2.2" fill="#E8E1DD"/>
  </g>

  <!-- 8. Safety Cones on Floor Platform -->
  <!-- Left Cone -->
  <g filter="url(#softCardShadow)">
    <polygon points="160,248 174,286 146,286" fill="url(#craneGrad)"/>
    <rect x="142" y="284" width="36" height="5" rx="2.5" fill="#B85028"/>
    <!-- Reflective White Stripes -->
    <polygon points="157,258 163,258 167,267 153,267" fill="#FFFFFF"/>
    <polygon points="151,272 169,272 172,280 148,280" fill="#FFFFFF"/>
  </g>

  <!-- Right Cone -->
  <g filter="url(#softCardShadow)">
    <polygon points="310,254 322,286 298,286" fill="url(#craneGrad)"/>
    <rect x="295" y="284" width="30" height="5" rx="2.5" fill="#B85028"/>
    <!-- Reflective White Stripes -->
    <polygon points="307,262 313,262 316,270 304,270" fill="#FFFFFF"/>
    <polygon points="302,274 318,274 320,281 300,281" fill="#FFFFFF"/>
  </g>

  <!-- 9. Modern Builder / Architect Hardhat (Foreground Left Center) -->
  <g filter="url(#softCardShadow)" transform="rotate(-6 220 270)">
    <!-- Helmet Shell -->
    <path d="M195 272C195 258 206 248 222 248C238 248 249 258 249 272Z" fill="url(#helmetGrad)"/>
    <!-- Hardhat Ridge Center -->
    <path d="M220 248C220 248 224 254 224 272" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <!-- Hardhat Rim Visor -->
    <path d="M190 272C190 270 200 271 222 271C244 271 254 270 254 272C254 274.5 244 275.5 222 275.5C200 275.5 190 274.5 190 272Z" fill="#8C2C08"/>
    <!-- White Reflective Headband Stripe -->
    <path d="M196 268C202 266 212 265 222 265C232 265 242 266 248 268" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- 10. Floating Secular Sparkles & Construction Accent Nodes -->
  <!-- Gold Sparkle Top-Left -->
  <g fill="url(#goldGrad)" transform="translate(130, 80)">
    <path d="M8 0L9.8 5.6L16 8L9.8 10.4L8 16L6.2 10.4L0 8L6.2 5.6Z"/>
  </g>
  <!-- Terracotta Sparkle Center-Right -->
  <g fill="#B85028" transform="translate(290, 85)">
    <path d="M6 0L7.4 4.2L12 6L7.4 7.8L6 12L4.6 7.8L0 6L4.6 4.2Z"/>
  </g>
  <!-- Sage Sparkle Bottom-Right -->
  <g fill="#486B52" transform="translate(420, 130)">
    <path d="M7 0L8.6 4.9L14 7L8.6 9.1L7 14L5.4 9.1L0 7L5.4 4.9Z"/>
  </g>

  <!-- Little Measurement Badges & Floating Metric Ticks -->
  <g transform="translate(65, 120)" filter="url(#softCardShadow)">
    <rect x="0" y="0" width="60" height="22" rx="11" fill="#FAF2EE" stroke="#E8E1DD" stroke-width="1.2"/>
    <circle cx="11" cy="11" r="3.5" fill="#B85028"/>
    <text x="21" y="14" font-family="ui-monospace, monospace" font-size="8.5" font-weight="bold" fill="#57423B">v1.2 // DEV</text>
  </g>

  <circle cx="165" cy="105" r="3" fill="#E2845E" opacity="0.6"/>
  <circle cx="215" cy="75" r="2.5" fill="#486B52" opacity="0.5"/>
  <circle cx="395" cy="85" r="3.5" fill="#B85028" opacity="0.5"/>
  <circle cx="310" cy="120" r="2" fill="#8A726A" opacity="0.6"/>
</svg>

