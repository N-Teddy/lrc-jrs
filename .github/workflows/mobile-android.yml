name: Mobile Android Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install root dependencies
        working-directory: .
        run: pnpm install

      - name: Build shared packages
        working-directory: .
        run: pnpm --filter @jrs/shared build && pnpm --filter @jrs/api-client build

      - name: Prebuild Android project (Expo)
        run: pnpm exec expo prebuild --platform android --clean

      - name: Assemble Release APK
        working-directory: ./apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Android Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jrs-mobile-android-release
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
